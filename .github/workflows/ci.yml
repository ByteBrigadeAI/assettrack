name: Application checks
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assets-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test services/assets-svc/Tests/AssetsService.Tests.csproj --verbosity minimal
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
  java-build:
    runs-on: ubuntu-latest
    env:
      WORKFORCE_DB_PATH: /tmp/workforce-demo.db
      AUDIT_DB_PATH: /tmp/audit-demo.db
      AUTH_DB_PATH: /tmp/auth-demo.db
    strategy:
      fail-fast: false
      matrix:
        service: [workforce-svc, audit-svc, auth-svc]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress verify
        working-directory: services/${{ matrix.service }}
  python-check:
    runs-on: ubuntu-latest
    env:
      NOTIFICATIONS_DB_PATH: /tmp/notifications-demo.db
    strategy:
      matrix:
        service: [reporting-svc, notifications-svc]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
        working-directory: services/${{ matrix.service }}
      - run: python -m compileall -q app
        working-directory: services/${{ matrix.service }}
      - name: Check application import
        run: python -c "from app.main import app; assert any(route.path == '/health' for route in app.routes)"
        working-directory: services/${{ matrix.service }}
